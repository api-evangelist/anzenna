aid: anzenna
name: Anzenna
description: >-
  Anzenna is an AI-powered insider risk and SOC platform that gives security teams
  unified visibility across identity, endpoint, SaaS, and cloud without deploying
  agents. Founded by former Yahoo and LinkedIn security leaders and based in Redwood
  City, CA, Anzenna correlates signals from 130+ integrations (Okta, CrowdStrike,
  Microsoft 365, Google Workspace, Snowflake, Jamf, and more) and uses agentic AI
  investigation agents to turn insider-risk alerts into fully reasoned case files. The
  platform covers shadow-AI discovery and control, data loss prevention with behavior-
  first analytics, identity threat detection, and user activity monitoring, and is
  SOC 2 Type 2 and Microsoft 365 certified.
